<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link href="./css/style.css" rel="stylesheet">
</head>

<body>
    <div class="container">
        <form>
            <fieldset class="form-one">
                <h2 class="title">Ваши личные данные</h2>
                <label class="label">
                    Ваше имя:
                    <input class="input" type="text" inputmode="text" placeholder="Ваше имя" required>
                </label>
                <label class="label">
                    Ваш возраст:
                    <input class="input" type="text" inputmode="text" placeholder="Возраст" required>
                </label>
                <label class="label">
                    Ваш номер телефона
                    <input class="input" type="tel" inputmode="tel" placeholder="Номер телефона" required>
                </label>
                <label class="label">
                    Ваша почта
                    <input class="input" type="email" inputmode="email" placeholder="Почта" required>
                </label>
            </fieldset>
            <fieldset class="form-two">
                <label class="label">
                    Сообщение
                    <textarea class="textarea" name="massage" placeholder="Ваше сообщение" required></textarea>
                </label>
                
            </fieldset>
            <label class="label">
                <input class="checkbox" type="checkbox" name="button" value="agree" required>
                Я принимаю правила
            </label>
            <button class="button">
                Отправить
            </button>
        </form>
    </div>
</body>

</html>
